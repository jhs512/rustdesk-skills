interface:
  display_name: "jhs512-rust-desk:listen"
  short_description: "맥 MCP로 RustDesk 통화를 수락하고 휴대폰 음성을 입력받도록 설정"
  default_prompt: "$listen 스킬로 이동-1초-수락 클릭-1초-Audio input 클릭-1초-시스템 소리 클릭을 바로 실행해 줘."
dependencies:
  tools:
    - type: "mcp"
      value: "macos-mcp"
      description: "필수 맥 MCP: Move, Click, Wait (필요 시 Snapshot) 및 macOS 접근성·화면 기록 권한"
policy:
  allow_implicit_invocation: true
